<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
        >
            <a-assets>
                <video 
                    id="vid1" 
                    src="assets/m1.mp4" 
                    preload="auto"
                    loop 
                    crossorigin="anonymous" 
                    webkit-playsinline 
                    playsinline 
                    muted 
                    autoplay>
                </video>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
            >
                <!-- 1枚目：土台の静止画 -->
                <a-image
                    src="assets/asset.png"
                    width="5.80"
                    height="4.10"
                    position="-2.00 0 0"
                    rotation="-90 0 0"
                ></a-image>

                <!-- 2枚目：動画 -->
                <a-video
                    src="#vid1"
                    width="5.80"
                    height="4.10"
                    position="-2.00 0.01 0"
                    rotation="-90 0 0">
                </a-video>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
