<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
        
        <!-- マーカーを認識したら再生、外れたら停止する仕組みを定義 -->
        <script>
            AFRAME.registerComponent('vidhandler', {
                init: function () {
                    this.toggle = false;
                    this.vid = document.querySelector("#vid1");
                },
                tick: function () {
                    if (this.el.object3D.visible === true) {
                        if (!this.toggle) {
                            this.toggle = true;
                            this.vid.play();
                        }
                    } else {
                        if (this.toggle) {
                            this.toggle = false;
                            this.vid.pause();
                        }
                    }
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
        >
            <a-assets>
                <video 
                    id="vid1" 
                    src="assets/m1.mp4" 
                    preload="auto"
                    loop 
                    crossorigin="anonymous" 
                    webkit-playsinline 
                    playsinline 
                    muted 
                    autoplay>
                </video>
            </a-assets>

            <!-- マーカーに vidhandler を追加 -->
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                vidhandler
            >
                <a-image
                    src="assets/asset.png"
                    width="5.80"
                    height="4.10"
                    position="-2.00 0 0"
                    rotation="-90 0 0"
                ></a-image>

                <a-entity
                    material="shader: chromakey; src: #vid1; color: 0.1 0.9 0.2; transparent: true"
                    geometry="primitive: plane; width: 5.80; height: 4.10"
                    position="-2.00 0.5 0"
                    rotation="-90 0 0"
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
