<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
        
        <script>
            AFRAME.registerComponent('ar-video-control', {
                init: function () {
                    var videos = document.querySelectorAll("video");
                    
                    this.el.addEventListener('markerFound', function () {
                        videos.forEach(function(video) {
                            var playPromise = video.play();
                            if (playPromise !== undefined) {
                                playPromise.catch(function(error) {
                                    console.log("再生ブロック:", error);
                                });
                            }
                        });
                    });
                    this.el.addEventListener('markerLost', function () {
                        videos.forEach(function(video) {
                            video.pause();
                        });
                    });
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
        >
            <a-assets>
                <video id="vid1" src="assets/m1.mp4#t=0.001" preload="auto" loop playsinline webkit-playsinline muted autoplay></video>
                <video id="vid2" src="assets/m2.mp4#t=0.001" preload="auto" loop playsinline webkit-playsinline muted autoplay></video>
                <video id="vid3" src="assets/m3.mp4#t=0.001" preload="auto" loop playsinline webkit-playsinline muted autoplay></video>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                ar-video-control
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- 1枚目：土台の静止画 (Y軸: 0) -->
                <a-image
                    src="assets/asset.png"
                    width="5.80"
                    height="4.10"
                    position="-2.00 0 0"
                    rotation="-90 0 0"
                ></a-image>

                <!-- 2枚目：m1（一番奥 Y軸: 0.25） -->
                <a-entity
                    material="shader: chromakey; src: #vid1; color: 0.1 0.9 0.2; transparent: true"
                    geometry="primitive: plane; width: 5.80; height: 4.10"
                    position="-2.00 0.25 0"
                    rotation="-90 0 0"
                ></a-entity>

                <!-- 3枚目：m3（m1の手前 Y軸: 0.5） -->
                <a-entity
                    material="shader: chromakey; src: #vid3; color: 0.1 0.9 0.2; transparent: true"
                    geometry="primitive: plane; width: 5.80; height: 4.10"
                    position="-2.00 0.5 0"
                    rotation="-90 0 0"
                ></a-entity>

                <!-- 4枚目：m2（一番手前 Y軸: 0.75） -->
                <a-entity
                    material="shader: chromakey; src: #vid2; color: 0.1 0.9 0.2; transparent: true"
                    geometry="primitive: plane; width: 5.80; height: 4.10"
                    position="-2.00 0.75 0"
                    rotation="-90 0 0"
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
