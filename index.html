<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
        
        <script>
            // マーカー認識時に確実に動画をキックする仕組み
            AFRAME.registerComponent('ar-video-control', {
                init: function () {
                    var video = document.querySelector("#vid1");
                    
                    this.el.addEventListener('markerFound', function () {
                        // iOSのブロックを回避しつつ再生を試みる処理
                        var playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(function(error) {
                                console.log("再生ブロック:", error);
                            });
                        }
                    });
                    this.el.addEventListener('markerLost', function () {
                        video.pause();
                    });
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
        >
            <a-assets>
                <!-- srcの末尾に #t=0.001 を追加してiOSの描画バグを回避 -->
                <video 
                    id="vid1" 
                    src="assets/m1.mp4#t=0.001" 
                    preload="auto"
                    loop 
                    playsinline 
                    webkit-playsinline 
                    muted 
                    autoplay>
                </video>
            </a-assets>

            <!-- ar-video-controlを追加 -->
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                ar-video-control
            >
                <a-image
                    src="assets/asset.png"
                    width="5.80"
                    height="4.10"
                    position="-2.00 0 0"
                    rotation="-90 0 0"
                ></a-image>

                <a-entity
                    material="shader: chromakey; src: #vid1; color: 0.1 0.9 0.2; transparent: true"
                    geometry="primitive: plane; width: 5.80; height: 4.10"
                    position="-2.00 0.5 0"
                    rotation="-90 0 0"
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
